name: RTOSTwin CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r bridge/requirements.txt
          pip install pytest
      - name: Run Python tests
        run: |
          python -m pytest bridge/tests/ -v

  python_lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mypy
          pip install -r bridge/requirements.txt
      - name: Run mypy
        run: mypy bridge/ --ignore-missing-imports

  c_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Compile and Run C Unit Tests
        run: |
          gcc agent/tests/test_crc.c -Iagent/core -o test_crc && ./test_crc
          gcc agent/tests/test_encoder.c -Iagent/core -o test_encoder && ./test_encoder
          gcc agent/tests/test_framer.c -Iagent/core -o test_framer && ./test_framer
          gcc agent/tests/test_profiler.c -Iagent/core -o test_profiler && ./test_profiler

  c_firmware_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install arm-none-eabi-gcc
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi
      - name: Syntax and Size check
        run: |
          arm-none-eabi-gcc -c agent/core/encoder.c -Iagent/core -Iagent/tests/mocks -ffreestanding -O2
          arm-none-eabi-gcc -c agent/core/framer.c -Iagent/core -Iagent/tests/mocks -ffreestanding -O2
          arm-none-eabi-size encoder.o framer.o
