name: RTOSTwin CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r bridge/requirements.txt
          pip install pytest
      - name: Run Python tests
        run: |
          cd digitaltwin-main
          python -m pytest bridge/tests/ -v

  c_lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install arm-none-eabi-gcc
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi
      - name: Syntax check C files
        run: |
          arm-none-eabi-gcc -c agent/core/encoder.c -Iagent/core -Iagent/tests/mocks -ffreestanding
          arm-none-eabi-gcc -c agent/core/framer.c -Iagent/core -Iagent/tests/mocks -ffreestanding
